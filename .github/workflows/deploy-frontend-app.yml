name: Build and Deploy Frontend App to ECS

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag Docker image
        run: |
          cd frontend
          docker build -t "518668548300.dkr.ecr.ap-southeast-2.amazonaws.com/ai-voice-assistant-frontend:latest" .

      - name: Push image to Amazon ECR
        run: |
          docker push "518668548300.dkr.ecr.ap-southeast-2.amazonaws.com/ai-voice-assistant-frontend:latest"

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster ai-voice-assistant-cluster \
            --service ai-voice-assistant-frontend-service \
            --force-new-deployment
