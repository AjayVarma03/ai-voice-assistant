name: Deploy AI Voice Demo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync code to /opt/ai-voice-assistant
        run: rsync -av --delete --exclude='.git' --exclude='.env' --exclude='backend/.env' --exclude='backend/venv' --exclude='node_modules' ./ /opt/ai-voice-assistant/

      - name: Install dependencies and restart FastAPI
        working-directory: /opt/ai-voice-assistant/backend
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          sudo systemctl restart ai-voice-backend